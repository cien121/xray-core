name: Build Mist AAR

# Replicates 2dust/AndroidLibXrayLite build flow verbatim, but with
# github.com/xtls/xray-core replaced by this repo's mist branch
# (contains proxy/mist native outbound + uTLS Chrome 155).

on:
  workflow_dispatch:
  # NOTE: workflow_dispatch is only registered by GitHub after the file has
  # been seen via a push event. This push trigger (scoped to this file on the
  # mist branch) forces registration; afterwards dispatch works too.
  push:
    branches:
      - mist
    paths:
      - '.github/workflows/build-mist-aar.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout xray-core (mist branch)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: xray-core

      - name: Checkout AndroidLibXrayLite wrapper
        uses: actions/checkout@v6
        with:
          repository: 2dust/AndroidLibXrayLite
          ref: main
          path: wrapper

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: 'wrapper/go.mod'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:~/go/bin

      - name: Point wrapper at local mist xray-core
        working-directory: wrapper
        run: |
          go mod edit -replace github.com/xtls/xray-core=../xray-core
          # mist branch pins xtls/reality to the Mar 2026 API ([]byte keys);
          # the wrapper's newer Oct 2026 pin changed the API to typed
          # crypto/ecdh + crypto/mldsa keys, which mist's
          # transport/internet/reality/config.go was not written against.
          # Downgrade so MVS selects the version mist was built/tested with.
          go mod edit -require=github.com/xtls/reality@v0.0.0-20260322125925-9234c772ba8f
          grep -E 'xtls/reality' go.mod

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Build
        working-directory: wrapper
        run: |
          mkdir -p assets data
          bash gen_assets.sh download
          cp -v data/*.dat assets/
          gomobile init
          go mod tidy
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./

      - name: Verify Mist outbound in AAR
        working-directory: wrapper
        run: |
          ls -la libv2ray*.aar
          rm -rf aar-check && mkdir -p aar-check
          unzip -o -q libv2ray.aar -d aar-check
          SO=aar-check/jni/arm64-v8a/libgojni.so
          MIST_COUNT=$(strings "$SO" | grep -c 'proxy/mist' || true)
          UTLS_COUNT=$(strings "$SO" | grep -c 'hellochrome_155' || true)
          echo "proxy/mist strings hits: $MIST_COUNT"
          echo "hellochrome_155 strings hits: $UTLS_COUNT"
          [ "$MIST_COUNT" -gt 0 ] || { echo "FAIL: proxy/mist not found in libgojni.so"; exit 1; }
          [ "$UTLS_COUNT" -gt 0 ] || { echo "FAIL: hellochrome_155 not found in libgojni.so"; exit 1; }
          echo "verification passed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libv2ray-mist
          path: wrapper/libv2ray*.aar
          retention-days: 7
