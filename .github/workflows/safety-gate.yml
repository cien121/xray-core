name: Safety Gate — random-ciphertext Initial must not ship (xray)

# Client-side half of the two-layer protection for the Phase 1 test-only
# Initial codec (proxy/mist RandomCiphertextCodec: random ciphertext in a
# QUIC long header, a DPI fingerprint that must never run on a public
# network):
#
#  Layer 1 — runtime gate: NewClient refuses a public server address when
#    UDP is enabled and the codec is not production-safe
#    (CheckInitialCodecSafeForAddr, unit-tested by
#    proxy/mist/initial_codec_safety_test.go, runs WITHOUT the tag).
#
#  Layer 2 — build tag: without `-tags mist_unsafe_initial` the codec is an
#    inert stub (proxy/mist/initial_codec_disabled.go); the real
#    implementation (initial_codec_unsafe.go) is excluded. `go tool nm`
#    must NOT find its implementation symbols (buildInitial /
#    parseInitialPacket) in the release binary.
#
# NOTE: this workflow builds ./main (test files are not compiled), so it is
# independent of proxy/mist test-file state.

on:
  push:
    branches: [mist]
    paths: ['proxy/mist/**', '.github/workflows/safety-gate.yml']
  pull_request:
    paths: ['proxy/mist/**']
  workflow_dispatch:

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build xray binary (NO unsafe tag)
        run: go build -o /tmp/xray-release ./main

      - name: Assert unsafe codec symbols ABSENT from release binary
        run: |
          if go tool nm /tmp/xray-release | grep -q "proxy/mist.(\*RandomCiphertextCodec).buildInitial\|proxy/mist.(\*RandomCiphertextCodec).parseInitialPacket"; then
            echo "::error::release binary contains random-ciphertext codec implementation symbols"
            go tool nm /tmp/xray-release | grep "RandomCiphertextCodec" | head
            exit 1
          fi
          echo "OK: no unsafe codec symbols in release binary"

      - name: Safety-gate unit tests (no tag needed)
        run: go test ./proxy/mist/ -run 'TestCheckInitialCodecSafeForAddr|TestCodecProductionSafeFailClosed' -v

      - name: Lab build sanity (WITH tag, symbols present)
        run: |
          go build -tags mist_unsafe_initial -o /tmp/xray-lab ./main
          if ! go tool nm /tmp/xray-lab | grep -q "proxy/mist.(\*RandomCiphertextCodec).buildInitial"; then
            echo "::error::lab binary is missing codec symbols — the nm check itself may be broken"
            exit 1
          fi
          echo "OK: lab binary contains codec symbols (the check is effective)"
